name: opencode-docker

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=${USER_UID:-1000}
        - USER_GID=${USER_GID:-1000}
        - SYSTEM_PACKAGES=${SYSTEM_PACKAGES:-}
    container_name: opencode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - HOME=/home/opencode-user
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
    volumes:
      - ./workspace:/workspace
      - ./config/opencode:/home/opencode-user/.config/opencode
      - ./config/nvim:/home/opencode-user/.config/nvim
    stdin_open: true
    tty: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"


